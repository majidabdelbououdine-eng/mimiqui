<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>
(function(){
  "use strict";
  function api(){
    var h=location.hostname;
    if(h==="localhost"||h==="127.0.0.1") return "http://127.0.0.1:8787/api";
    return "/api";
  }
  var params=new URLSearchParams(location.search);
  var sid=params.get("session_id")||"";
  document.addEventListener("DOMContentLoaded", function(){
    var titre=document.querySelector("h1");
    var ps=document.querySelectorAll("main p");
    function msg(t1,t2){
      if(titre) titre.textContent=t1;
      if(ps[0]) ps[0].textContent=t2;
    }
    if(!sid){
      msg("Activation impossible","Le retour de paiement n'a pas fourni de session Stripe. Ouvrez « Mon compte » et restaurez l'accès avec l'e-mail utilisé lors du paiement.");
      return;
    }
    fetch(api()+"/merci?session_id="+encodeURIComponent(sid), { credentials:"include" })
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .then(function(res){
        if(res.ok && res.j && res.j.abonne){
          msg("Merci pour votre abonnement","Votre accès aux données de vente est activé. Vous allez être redirigé vers l'archive.");
          setTimeout(function(){ location.replace("archive-ventes.html"); }, 900);
        }else{
          msg("Paiement en cours ou incomplet",(res.j && res.j.error) || "Nous n'avons pas encore pu confirmer l'abonnement. Si vous venez de payer, patientez une minute puis ouvrez Mon compte.");
        }
      })
      .catch(function(){
        msg("Activation indisponible","L'API d'abonnement n'est pas joignable pour le moment. Réessayez, ou ouvrez Mon compte avec l'e-mail utilisé chez Stripe.");
      });
  });
})();
</script>
